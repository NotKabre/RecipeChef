<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | Cooklit</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <main class="signinPage">

        <a class="logo" href="cooking.html">
            Cooklit
        </a>

        <section class="signinCard">

            <p class="eyebrow">
                Cooklit
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="subtitle">
                Sign in to access your recipes, pantry, and favorites.
            </p>

            <p id="statusMessage" class="statusMessage" role="status" hidden></p>

            <form id="signinForm">

                <div class="inputGroup">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="inputGroup">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    class="signinButton"
                    type="submit"
                >
                    Sign In
                </button>

            </form>


            <div class="divider">

                <span></span>

                <p>or</p>

                <span></span>

            </div>


            <button
                class="googleButton"
                id="googleButton"
                type="button"
            >

                <span class="googleIcon">
                    G
                </span>

                Continue with Google

            </button>


            <p class="signupText">
                Don't have an account?

                <a href="#" id="createAccount">
                    Create one
                </a>
            </p>

        </section>

    </main>


    <script type="module" src="signin.js"></script>

</body>

</html>
