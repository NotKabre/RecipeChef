<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Cooklit</title>
    <link rel="stylesheet" href="signin.css?v=red-black-1">
</head>
<body>
    <main class="signinPage">
        <a class="logo" href="cooking.html">Cooklit</a>
        <section class="signinCard">
            <p class="eyebrow">Cooklit</p>
            <h1 id="resetHeading">Forgot password?</h1>
            <p class="subtitle" id="resetSubtitle">Enter your account email to receive a verification code.</p>
            <p id="statusMessage" class="statusMessage" role="status" hidden></p>

            <form id="emailForm">
                <div class="inputGroup">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <button class="signinButton" type="submit">Send Code</button>
            </form>

            <form id="codeForm" hidden>
                <div class="inputGroup">
                    <label for="code">Verification code</label>
                    <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
                        pattern="[0-9]+" placeholder="Enter the code from your email" required>
                </div>
                <button class="signinButton" type="submit">Verify Code</button>
                <button class="googleButton recoverySecondary" id="resendCode" type="button">Resend Code</button>
                <button class="googleButton recoverySecondary" id="changeEmail" type="button">Use a Different Email</button>
            </form>

            <p class="signupText"><a href="signin.html">Back to sign in</a></p>
        </section>
    </main>
    <script type="module" src="forgot-password.js"></script>
</body>
</html>
