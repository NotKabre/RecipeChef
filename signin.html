<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | Cooklit</title>

    <link rel="stylesheet" href="signin.css?v=white-google-button-1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800;900;1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="garden-pages.css?v=1">
</head>

<body class="gardenPage signinGarden">

    <main class="signinPage">

        <a class="gardenLogo" href="cooking.html" aria-label="Cooklit home"><img src="images/chef-hat.svg" alt="">Cooklit<span aria-hidden="true">✦</span></a>

        <section class="signinCard">

            <p class="eyebrow">
                Cooklit
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="subtitle">
                Sign in to access your recipes, pantry, and favorites.
            </p>

            <p id="statusMessage" class="statusMessage" role="status" hidden></p>

            <form id="signinForm">

                <div class="inputGroup">
                    <label for="displayName">Name</label>
                    <input
                        type="text"
                        id="displayName"
                        autocomplete="nickname"
                        placeholder="What should we call you?"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="inputGroup">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="inputGroup">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    class="signinButton"
                    type="submit"
                >
                    Sign In
                </button>

            </form>

            <p class="signupText"><a href="forgot-password.html">Forgot password?</a></p>


            <div class="divider">

                <span></span>

                <p>or</p>

                <span></span>

            </div>


            <button
                class="googleButton"
                id="googleButton"
                type="button"
            >

                <img class="googleIcon" src="images/google-g.png" alt="" width="20" height="20">
                <span data-button-label>Continue with Google</span>

            </button>


            <p class="signupText">
                Don't have an account?

                <a href="signup.html" id="createAccount">
                    Create one
                </a>
            </p>

        </section>

    </main>


    <script type="module" src="signin.js?v=google-button-1"></script>

</body>

</html>
