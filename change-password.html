<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Cooklit</title>
    <link rel="stylesheet" href="signin.css?v=red-black-1">
</head>
<body>
    <main class="signinPage">
        <a class="logo" href="cooking.html">Cooklit</a>
        <section class="signinCard">
            <p class="eyebrow">Cooklit</p>
            <h1 id="resetHeading">Change your password.</h1>
            <p class="subtitle" id="resetSubtitle">Choose a new password to use the next time you sign in.</p>
            <p id="statusMessage" class="statusMessage" role="status" hidden></p>

            <form id="passwordForm" hidden>
                <div class="inputGroup">
                    <label for="password">New password</label>
                    <input type="password" id="password" autocomplete="new-password" minlength="6"
                        placeholder="Create a new password" required>
                </div>
                <div class="inputGroup">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6"
                        placeholder="Enter your new password again" required>
                </div>
                <button class="signinButton" type="submit">Change Password</button>
            </form>

            <p class="signupText" id="restartRecovery" hidden><a href="forgot-password.html">Request a new verification code</a></p>
            <p class="signupText"><a href="signin.html">Back to sign in</a></p>
        </section>
    </main>
    <script type="module" src="change-password.js"></script>
</body>
</html>
