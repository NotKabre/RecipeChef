<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan Receipt | Cooklit</title>

    <link rel="stylesheet" href="camera.css?v=red-black-1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800;900;1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="garden-pages.css?v=1">
</head>

<body class="gardenPage cameraGarden">
    <header class="gardenHeader"><a class="gardenLogo" href="cooking.html" aria-label="Cooklit home"><img src="images/chef-hat.svg" alt="">Cooklit<span aria-hidden="true">✦</span></a><a class="homeLink" href="cooking.html">Back to home <span aria-hidden="true">↗</span></a></header>

    <div class="cameraContainer">

        <h1>Scan Your Receipt</h1>

        <p class="cameraInstructions">
            Place the receipt inside the frame and make sure the text is clear.
        </p>

        <div class="cameraBox">

            <video
                id="camera"
                autoplay
                playsinline
                muted
            ></video>

            <canvas id="canvas"></canvas>

        </div>

        <div class="buttonRow">

            <button
                id="captureBtn"
                type="button"
            >
                Capture
            </button>

            <button
                id="retakeBtn"
                type="button"
            >
                Retake
            </button>

            <button
                id="useBtn"
                type="button"
            >
                Use Receipt
            </button>

        </div>

    </div>


    <div id="scanningScreen">

        <div class="receiptPreview">

            <img
                id="receiptImage"
                alt="Captured receipt"
            >

            <div class="scanLine"></div>

        </div>

        <h2>Scanning Receipt...</h2>

        <p>Preparing OCR...</p>

        <div class="loadingDots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>


    <!-- Tesseract OCR must load before camera.js -->
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

    <script type="module" src="camera.js?v=walmart-ocr-1"></script>

</body>

</html>
